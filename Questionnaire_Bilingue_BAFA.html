<!DOCTYPE html>
<html lang="fr" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qualification de votre besoin — BAFA Neu GmbH</title>
<style>
:root{--g:#3a6b35;--g2:#2a5228;--r:10px;--sh:0 2px 8px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:14px;background:#f0f2f0;color:#1a1a1a;line-height:1.6}
.wrap{max-width:840px;margin:20px auto;padding:0 14px 40px}
.header{background:#f2f7f1;border:1px solid #c8dfc4;border-radius:var(--r) var(--r) 0 0;
  padding:20px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:relative}
.header img.logo{height:60px;width:auto}
.header-text h1{font-size:17px;font-weight:700;color:var(--g2)}
.header-text .sub{font-size:11px;color:#666;font-style:italic;margin-top:3px}
.header-text .tagline{font-size:11px;color:var(--g);font-weight:600;margin-top:4px;font-style:normal}
.lang-btn{position:absolute;top:14px;right:14px;background:var(--g);color:#fff;border:none;
  padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s}
.lang-btn:hover{background:var(--g2)}
.float-btn{position:fixed;right:18px;top:50%;transform:translateY(-50%);
  background:var(--g);color:#fff;border:none;border-radius:24px;
  padding:10px 14px;font-size:11px;font-weight:700;cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.25);writing-mode:vertical-rl;
  text-orientation:mixed;letter-spacing:.5px;transition:background .15s,box-shadow .15s;
  z-index:999;line-height:1.4}
.float-btn:hover{background:var(--g2);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.float-btn.hidden{display:none}
.float-error{position:fixed;right:70px;top:50%;transform:translateY(-50%);
  background:#fff3cd;border:1px solid #e0a800;color:#856404;
  padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;
  box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:998;max-width:200px;
  text-align:center;display:none}
.intro{background:#e8f5e3;border:1px solid #b8ddb0;border-top:none;padding:11px 22px;font-size:12px;color:#2d5a29;font-style:italic}
.sec{background:#fff;border:1px solid #ddd;border-radius:var(--r);margin-top:14px;overflow:hidden;box-shadow:var(--sh)}
.sec-head{padding:11px 18px 11px 14px;display:flex;align-items:center;gap:12px}
.sec-icon{width:40px;height:40px;object-fit:contain;flex-shrink:0;border-radius:6px;background:#f9f8f5;padding:3px}
.sec-title{color:#fff;font-size:13px;font-weight:700;letter-spacing:.2px}
.sec-note{font-size:11px;color:#888;font-style:italic;padding:7px 18px 0}
.field{padding:9px 18px;border-bottom:1px solid #f2f2f2}
.field:last-child{border-bottom:none}
.field label{display:block;font-size:12px;font-weight:600;color:#333;margin-bottom:4px}
.req{color:#c0392b;margin-left:2px}
.note{display:block;font-size:11px;font-weight:400;color:#999;font-style:italic;margin-top:1px}
input[type=text],input[type=email],input[type=tel],input[type=url],
input[type=date],select,textarea{width:100%;padding:7px 10px;border:1px solid #ccc;
  border-radius:6px;font-size:13px;font-family:Arial,sans-serif;background:#fff;transition:border-color .2s,background .2s}
input.required-field,select.required-field,textarea.required-field{background:#f0faf2;border-color:#9dcfaa}
input.field-error,select.field-error,textarea.field-error{background:#fff0f0;border-color:#e88}
input[type=date][readonly]{background:#f5f5f5 !important;color:#555;cursor:default;border-color:#ccc !important}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 2px rgba(58,107,53,.14);background:#fff !important}
textarea{resize:vertical}
.submit-wrap{text-align:center;margin-top:24px}
.btn-send{background:var(--g);color:#fff;border:none;padding:13px 52px;font-size:15px;
  font-weight:700;border-radius:8px;cursor:pointer;letter-spacing:.3px;transition:background .15s,transform .1s}
.btn-send:hover{background:var(--g2);transform:translateY(-1px)}
.btn-send:disabled{background:#aaa;cursor:not-allowed;transform:none}
.alert{display:none;margin-top:16px;padding:14px 20px;border-radius:8px;font-size:14px;font-weight:600;text-align:center}
.alert.success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
.alert.error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
.footer{margin-top:16px;background:var(--g2);border-radius:0 0 var(--r) var(--r);
  padding:14px 20px;text-align:center;font-size:11px;color:#a8d5a0;line-height:2}
.footer strong{color:#fff}
.footer a.site-link{display:inline-block;margin-top:6px;color:#fff;
  background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);
  padding:4px 14px;border-radius:20px;font-size:11px;font-weight:700;
  text-decoration:none;transition:background .15s}
.footer a.site-link:hover{background:rgba(255,255,255,0.25)}
@media(max-width:600px){
  .header{padding:14px;gap:14px}.header img.logo{height:55px}
  .lang-btn{position:static;margin-top:8px}.wrap{padding:0 8px 28px}
  .btn-send{padding:12px 32px;font-size:14px}
  .float-btn{right:8px;padding:8px 10px;font-size:10px}
  .float-error{right:60px;max-width:150px;font-size:11px}}
@media print{body{background:#fff}.wrap{margin:0;padding:0;max-width:100%}
  .sec{break-inside:avoid;box-shadow:none}.btn-send,.lang-btn,.float-btn,.float-error{display:none}}
</style>
</head>

const FIELD_TYPES = {"req_date": "date", "email": "email", "phone": "tel", "website": "url", "f_spec": "textarea", "ch_spec": "textarea", "comments": "textarea"};
let lang = "FR";
function setTodayDate() {
  var today=new Date(),dd=String(today.getDate()).padStart(2,'0'),
      mm=String(today.getMonth()+1).padStart(2,'0'),yyyy=today.getFullYear();
  var el=document.getElementById('req_date');
  if(el){el.value=yyyy+'-'+mm+'-'+dd;el.setAttribute('readonly','');}
}
function scrollToSend() {
  var missing=checkRequiredFields(false),floatErr=document.getElementById('float-error');
  if(missing>0){
    var msg=lang==="FR"
      ?missing+" champ"+(missing>1?"s":"")+" obligatoire"+(missing>1?"s":"")+" à remplir"
      :missing+" required field"+(missing>1?"s":"")+" missing";
    floatErr.textContent=msg;floatErr.style.display="block";
    setTimeout(function(){floatErr.style.display="none";},3000);
    var firstErr=document.querySelector('.field-error');
    if(firstErr)firstErr.scrollIntoView({behavior:'smooth',block:'center'});
  } else {
    floatErr.style.display="none";
    document.getElementById('btn-send').scrollIntoView({behavior:'smooth',block:'center'});
  }
}
function checkRequiredFields(markErrors) {
  var missing=0;
  document.querySelectorAll('[required]').forEach(function(el){
    var isEmpty=!el.value||el.value.trim()==='';
    if(markErrors){el.classList.toggle('field-error',isEmpty);if(!isEmpty)el.classList.add('required-field');}
    if(isEmpty)missing++;
  });
  return missing;
}
window.addEventListener('scroll',function(){
  var btn=document.getElementById('float-btn'),sw=document.getElementById('submit-wrap');
  if(!btn||!sw)return;
  var rect=sw.getBoundingClientRect();
  if(rect.top>=0&&rect.bottom<=window.innerHeight){btn.classList.add('hidden');}
  else{btn.classList.remove('hidden');}
});
function render() {
  var ui=lang==="FR"?FR_UI:EN_UI,fld=lang==="FR"?FR_FIELDS:EN_FIELDS,lst=lang==="FR"?FR_LISTS:EN_LISTS;
  document.documentElement.lang=lang==="FR"?"fr":"en";
  setText("ui-title",ui.title);setHTML("ui-subtitle",ui.subtitle);
  setText("ui-company",ui.company_ln);setHTML("ui-intro",ui.intro);
  setHTML("ui-tagline",ui.tagline||"");
  setText("lang-btn",ui.lang_btn);setText("btn-send",ui.send_btn);
  setText("float-btn",lang==="FR"?"Envoyer ↓":"Submit ↓");
  setHTML("ui-footer-ret",lang==="FR"
    ?"Retourner ce formulaire à : <strong>materne.heiligenstein@bafa-neu.de</strong>"
    :"Return this form to: <strong>materne.heiligenstein@bafa-neu.de</strong>");
  ["sec_a1","sec_a2","sec_b1","sec_b1_note","sec_b2","sec_b2_note","sec_b3","sec_b3_note","sec_c"].forEach(function(k){
    var el=document.getElementById("ui-"+k);if(el)el.textContent=ui[k];
  });
  SECTIONS.forEach(function(pair){
    var secId=pair[0],fieldList=pair[1],container=document.getElementById("fields-"+secId);
    if(!container)return;
    var saved={};
    container.querySelectorAll("[name]").forEach(function(el){saved[el.name]=el.value;});
    container.innerHTML="";
    fieldList.forEach(function(name){
      var fd=fld[name]||{label:name,req:false,note:""};
      var div=document.createElement("div");div.className="field";
      var reqMark=fd.req?'<span class="req">*</span>':"";
      var noteTxt=fd.note?'<span class="note">'+fd.note+'</span>':"";
      var reqAttr=fd.req?"required":"";
      var reqClass=fd.req?" required-field":"";
      var inp;
      if(LIST_FIELDS.indexOf(name)>=0&&lst[name]){
        var opts=lst[name].map(function(o){return '<option value="'+o+'">'+o+'</option>';}).join("");
        inp='<select name="'+name+'" id="'+name+'" class="'+reqClass.trim()+'" '+reqAttr+'><option value="">'+ui.placeholder+'</option>'+opts+'</select>';
      } else if(FIELD_TYPES[name]==="textarea"){
        inp='<textarea name="'+name+'" id="'+name+'" class="'+reqClass.trim()+'" rows="3" '+reqAttr+'></textarea>';
      } else {
        var t=FIELD_TYPES[name]||"text";
        inp='<input type="'+t+'" name="'+name+'" id="'+name+'" class="'+reqClass.trim()+'" '+reqAttr+'>';
      }
      div.innerHTML='<label for="'+name+'">'+fd.label+reqMark+noteTxt+'</label>'+inp;
      container.appendChild(div);
      if(saved[name]!==undefined){var el2=container.querySelector('[name="'+name+'"]');if(el2)el2.value=saved[name];}
      var inp2=container.querySelector('[name="'+name+'"]');
      if(inp2&&fd.req){
        inp2.addEventListener('change',function(){
          if(this.value&&this.value.trim()!==''){this.classList.remove('field-error');this.classList.add('required-field');}
        });
      }
    });
  });
  setTodayDate();
}
function toggleLang(){lang=lang==="FR"?"EN":"FR";render();}
function setText(id,val){var el=document.getElementById(id);if(el)el.textContent=val;}
function setHTML(id,val){var el=document.getElementById(id);if(el)el.innerHTML=val;}

function handleSubmit(e) {
  e.preventDefault();
  checkRequiredFields(true);
  var missing=checkRequiredFields(false);
  if(missing>0){var firstErr=document.querySelector('.field-error');if(firstErr)firstErr.scrollIntoView({behavior:'smooth',block:'center'});return;}
  var ui=lang==="FR"?FR_UI:EN_UI,btn=document.getElementById("btn-send"),alertEl=document.getElementById("alert-box");
  btn.disabled=true;btn.textContent=ui.sending;alertEl.style.display="none";
  var data={};
  data["_lang"]=lang;data["_variant"]="BAFA";data["_timestamp"]=new Date().toISOString();
  new FormData(document.getElementById("qform")).forEach(function(v,k){data[k]=v;});
  var encoded=Object.keys(data).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(data[k]);}).join("&");
  fetch(APPS_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:encoded})
  .then(function(){
    setTimeout(function(){
      btn.disabled=false;btn.textContent=ui.send_btn;
      alertEl.className="alert success";alertEl.textContent=ui.success;alertEl.style.display="block";
      document.getElementById("qform").reset();
      document.querySelectorAll('[required]').forEach(function(el){el.classList.add('required-field');el.classList.remove('field-error');});
      setTodayDate();alertEl.scrollIntoView({behavior:"smooth",block:"center"});
    },2000);
  }).catch(function(err){
    console.error(err);btn.disabled=false;btn.textContent=ui.send_btn;
    alertEl.className="alert error";alertEl.textContent=ui.error;alertEl.style.display="block";
    alertEl.scrollIntoView({behavior:"smooth",block:"center"});
  });
}
render();
</script>
